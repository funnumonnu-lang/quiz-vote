const HOST_PASS = 'mokume2026';

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票クイズ</title>
<style>
  :root{
    --ink:#17201d; --ink-2:#4a5754; --ink-3:#8b9793;
    --base:#eaeeeb; --card:#fbfcfb; --line:#d3dad6;
    --indigo:#27456f; --indigo-soft:#e3e9f1;
    --mustard:#c08a1e; --mustard-soft:#fdf8ec;
    --green:#2f6f4f; --green-soft:#e2eee8;
    --red:#a33d2e;
    --shadow:0 1px 2px rgba(23,32,29,.06),0 8px 24px -16px rgba(23,32,29,.35);
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,"Noto Sans JP",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--base);color:var(--ink);font-family:var(--gothic);
    font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;padding-bottom:100px}
  h1,h2,h3{font-family:var(--mincho);font-weight:600;letter-spacing:.02em;margin:0}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:inherit;color:inherit}
  .wrap{max-width:800px;margin:0 auto;padding:0 18px}

  .bar{position:sticky;top:0;z-index:20;background:rgba(234,238,235,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:800px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{font-family:var(--mincho);font-size:16px;letter-spacing:.16em;white-space:nowrap}
  .bar-sp{flex:1}
  .code{font-family:var(--mono);font-size:15px;letter-spacing:.22em;font-weight:600;
    background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 4px 3px 10px}
  .code small{display:block;font-size:9px;letter-spacing:.12em;color:var(--ink-3);line-height:1.2;font-family:var(--gothic)}
  .phase{font-size:11px;letter-spacing:.14em;padding:5px 10px;border-radius:99px;
    border:1px solid currentColor;white-space:nowrap}
  .phase.idle{color:var(--ink-3)}
  .phase.voting{color:var(--indigo);background:var(--indigo-soft)}
  .phase.closed{color:var(--mustard);background:var(--mustard-soft)}
  .phase.results{color:var(--green);background:var(--green-soft)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
  .pad{padding:20px}
  .stack>*+*{margin-top:14px}
  .muted{color:var(--ink-2)}
  .tiny{font-size:12.5px;color:var(--ink-3);line-height:1.6}
  .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--ink-3);font-family:var(--mono)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  hr{border:0;border-top:1px solid var(--line);margin:18px 0}

  .btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;
    padding:11px 18px;font-weight:600;letter-spacing:.03em;transition:transform .08s ease,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.primary{background:var(--indigo);border-color:var(--indigo)}
  .btn.go{background:var(--green);border-color:var(--green)}
  .btn.stop{background:var(--mustard);border-color:var(--mustard)}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.danger{background:transparent;color:var(--red);border-color:#e0c4bd}
  .btn.sm{padding:6px 12px;font-size:13px;border-radius:6px}
  .btn.wide{width:100%;padding:14px;font-size:16px}
  .btn:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--indigo);outline-offset:2px}

  input[type=text],input[type=url]{width:100%;background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 11px}
  input[type=text]:focus,input[type=url]:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:transparent}
  input[type=number]{width:64px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 6px;text-align:center;font-family:var(--mono)}

  .hero{text-align:center;padding:52px 0 26px}
  .hero h1{font-size:30px;line-height:1.4}
  .hero .lead{margin-top:12px;color:var(--ink-2);font-size:14px}
  .tally-hero{display:flex;justify-content:center;gap:6px;margin-bottom:22px}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0 18px}
  .tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;
    color:var(--ink-3);font-weight:600;letter-spacing:.06em;font-size:13.5px;margin-bottom:-1px}
  .tab.on{color:var(--ink);border-bottom-color:var(--indigo)}

  .q{margin-bottom:14px}
  .q-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px}
  .q-no{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:10px;min-width:34px}
  .q-body{flex:1;min-width:0}
  .choices{padding:0 18px 16px 64px}
  .ch{display:flex;align-items:center;gap:9px;margin-top:8px}
  .ch-key{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:16px;flex:none}
  .mark{display:inline-flex;align-items:center;gap:5px;flex:none;border:1px solid var(--line);
    background:#fff;border-radius:6px;padding:6px 9px;font-size:12px;color:var(--ink-3);white-space:nowrap}
  .mark input{margin:0;accent-color:var(--green)}
  .mark.on{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .x{border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;padding:4px 6px;border-radius:5px;flex:none}
  .x:hover{background:var(--base);color:var(--red)}

  /* 現在の設問（投票画面・進行画面で共用） */
  .stage{padding:24px 22px}
  .stage .qtext{font-family:var(--mincho);font-size:23px;line-height:1.5;margin:8px 0 4px}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px 16px;margin-top:10px;
    line-height:1.55;font-size:16px;transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--ink-3)}
  .opt.sel{border-color:var(--indigo);background:var(--indigo-soft);box-shadow:inset 0 0 0 1px var(--indigo)}
  .opt.dim{opacity:.55}
  .opt-key{font-family:var(--mono);font-size:13px;color:var(--ink-3);padding-top:2px;flex:none}
  .opt.sel .opt-key{color:var(--indigo)}

  /* 設問ナビ */
  .qnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:6px;
    border:1px solid var(--line);background:#fff;color:var(--ink-3);min-width:38px;text-align:center}
  .chip.done{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .chip.now{border-color:var(--indigo);color:#fff;background:var(--indigo);font-weight:700}

  /* 結果 */
  .res-row{margin-top:14px}
  .res-line{display:flex;align-items:baseline;gap:9px}
  .res-key{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:16px;flex:none}
  .res-text{flex:1;min-width:0;line-height:1.5}
  .res-n{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap}
  .res-pct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap;width:42px;text-align:right}
  .track{height:7px;background:var(--base);border-radius:4px;margin:7px 0 0 25px;overflow:hidden}
  .fill{height:100%;background:var(--indigo);border-radius:4px;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .correct .fill{background:var(--green)}
  .correct .res-text{color:var(--green);font-weight:600}
  .tag{font-size:10.5px;letter-spacing:.1em;color:var(--green);border:1px solid var(--green);
    border-radius:4px;padding:1px 5px;vertical-align:2px;margin-left:6px;white-space:nowrap}
  .tag.you{color:var(--indigo);border-color:var(--indigo)}
  .tally{display:flex;gap:4px;align-items:center;margin:8px 0 0 25px;flex-wrap:wrap;min-height:16px}
  .tally svg{display:block}
  .verdict{font-family:var(--mincho);font-size:20px;padding:14px 18px;border-radius:9px;text-align:center;margin-bottom:14px}
  .verdict.ok{background:var(--green-soft);color:var(--green)}
  .verdict.ng{background:#fbeeeb;color:var(--red)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:11px;letter-spacing:.1em;color:var(--ink-3);font-weight:600}
  td.n{font-family:var(--mono);text-align:right;white-space:nowrap}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(251,252,251,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .dock-in{max-width:800px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .dock .status{font-size:12.5px;color:var(--ink-2);flex:1;min-width:120px}
  .big{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--ink)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:50;
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

  .link{font-family:var(--mono);font-size:12px;word-break:break-all;background:#fff;
    border:1px solid var(--line);border-radius:7px;padding:9px 11px;color:var(--ink-2)}
  .center{text-align:center}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--indigo);margin-right:7px;animation:p 1.6s infinite}
  .offline{background:#fbeeeb;border-color:#e0c4bd}
  @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:560px){
    .hero h1{font-size:24px}
    .choices{padding-left:18px}
    .stage{padding:20px 16px}
    .stage .qtext{font-size:20px}
  }
</style>
</head>
<body>
<div class="bar"><div class="bar-in" id="bar"></div></div>
<div id="app" class="wrap"></div>
<div id="dock"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   投票クイズ — GitHub Pages + GAS/スプレッドシート版
   1問ずつ「投票を開ける → 締め切る → 結果を発表」を進めます
   ここに Apps Script の /exec URL を入れると設定画面を省けます
   ============================================================ */
const API_URL = '';

// 出題者を限定したいときは、ここに合言葉を入れてください（例 'mokume2026'）。
// 設定すると ?host=合言葉 を付けて開いたときだけ「部屋をつくる」が表示されます。
// 空のままなら、参加リンク以外から開いた人は誰でも部屋を作れます。
const HOST_PASS = '';

const DEF_Q = 10;    // 設問数の初期値
const DEF_C = 4;     // 選択肢数の初期値
const KEYS  = ['A','B','C','D','E','F','G','H','I','J'];
const POLL  = 3000;  // 同期間隔(ms)
const LS    = 'quiz.v2';

const API = { url: API_URL };

const S = {
  role:null, room:'', hostKey:'', name:'', pid:'',
  tab:'edit',
  config:null,          // {title,phase,questions,cur,qphase,revealed,total}
  answers:null,         // {correct:[]}
  my:{}, votes:[],
  peers:0, answeredN:0,
  rev:0, sig:'',
  timer:null, busy:false, offline:false
};

/* ---------- 通信 ---------- */
function qstr(o){
  const u=new URLSearchParams();
  Object.keys(o).forEach(k=>{ if(o[k]!==undefined&&o[k]!==null) u.set(k,o[k]); });
  return u.toString();
}
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb='cb'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const t=setTimeout(()=>{clean();rej(new Error('timeout'))},15000);
    function clean(){ clearTimeout(t); try{delete window[cb]}catch(e){window[cb]=undefined} s.remove(); }
    window[cb]=d=>{clean();res(d)};
    s.onerror=()=>{clean();rej(new Error('network'))};
    s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb;
    document.body.appendChild(s);
  });
}
async function call(action,data,write){
  if(!API.url) throw new Error('APIのURLが未設定です');
  const body=Object.assign({action:action},data||{});
  let r;
  try{
    if(write){
      // Content-Type を付けないことで preflight を避ける（GASはOPTIONSに応答しないため）
      const res=await fetch(API.url,{method:'POST',body:JSON.stringify(body),redirect:'follow'});
      r=await res.json();
    }else{
      const res=await fetch(API.url+'?'+qstr(body),{redirect:'follow'});
      r=await res.json();
    }
  }catch(e){
    r=await jsonp(API.url+'?'+qstr(body));
  }
  setOffline(false);
  if(r&&r.ok===false&&r.error&&['auth','notfound','hidden','closed','notcurrent'].indexOf(r.error)<0)
    throw new Error(r.error);
  return r;
}
function setOffline(v){
  if(S.offline===v) return;
  S.offline=v;
  const n=document.getElementById('netbar');
  if(n) n.style.display=v?'block':'none';
}

/* ---------- セッション ---------- */
function saveSession(){
  try{ localStorage.setItem(LS,JSON.stringify({
    api:API.url, role:S.role, room:S.room, hostKey:S.hostKey, name:S.name, pid:S.pid })); }catch(e){}
}
function loadSession(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem(LS); }catch(e){} }

/* ---------- 小道具 ---------- */
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function freshPane(){ const o=document.getElementById('pane'); const n=el('<div id="pane"></div>'); o.replaceWith(n); return n; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2400); }
function setStatus(m){ toast(m); const s=$('#stat'); if(s) s.textContent=m; }
function hash(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h*33)^str.charCodeAt(i))>>>0; return 'p'+h.toString(36); }
const same=(a,b)=>{ const x=[...(a||[])].sort().join(','), y=[...(b||[])].sort().join(','); return x===y&&x!==''; };

const STROKE=['M3,4 H25','M14,4 V28','M3,16 H14','M22,16 V28','M3,28 H27'];
function tallySVG(n){
  let out='';
  for(let g=0;g<Math.ceil(n/5);g++){
    const k=Math.min(5,n-g*5); let p='';
    for(let i=0;i<k;i++) p+='<path d="'+STROKE[i]+'"/>';
    out+='<svg width="17" height="19" viewBox="0 0 30 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">'+p+'</svg>';
  }
  return out;
}
function joinURL(room){
  const u=new URL(location.href); u.hash=''; u.search='?room='+room;
  if(!API_URL&&API.url) u.search+='&api='+encodeURIComponent(API.url);
  return u.toString();
}
function sigOf(c){ return c?[c.phase,c.cur,c.qphase,(c.revealed||[]).length,c.title,c.total].join('|'):''; }

/* ============================================================
   設定画面
   ============================================================ */
function screenSetup(){
  $('#bar').innerHTML='<span class="brand">投 票 ク イ ズ</span>';
  $('#dock').innerHTML='';
  $('#app').innerHTML=`
    <div class="hero"><h1>最初に接続先を設定します</h1>
      <p class="lead">Apps Script で公開したウェブアプリのURL（末尾が /exec）を貼り付けてください。<br>このブラウザに保存され、次回から表示されません。</p></div>
    <div class="card pad stack">
      <input type="url" id="apiu" placeholder="https://script.google.com/macros/s/……/exec" value="${esc(API.url)}">
      <button class="btn primary" id="apisave">接続を確認して保存</button>
      <p class="tiny">READMEの手順どおりにデプロイし、アクセスできるユーザーを「全員」にしてください。応答まで数秒かかります。</p>
    </div>`;
  $('#apisave').onclick=async()=>{
    const v=($('#apiu').value||'').trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){ toast('/exec で終わるURLを入れてください'); return; }
    const b=$('#apisave'); b.disabled=true; b.textContent='確認中…';
    API.url=v;
    try{
      const r=await call('ping',{});
      if(!r||!r.ok) throw new Error('bad');
      saveSession(); toast('接続できました'); screenStart();
    }catch(e){ b.disabled=false; b.textContent='接続を確認して保存';
      toast('つながりません。URLと公開設定を確認してください'); }
  };
}

/* ============================================================
   トップ
   ============================================================ */
function screenStart(prefill){
  $('#bar').innerHTML='<span class="brand">投 票 ク イ ズ</span>';
  $('#dock').innerHTML='';
  const qp=new URLSearchParams(location.search);
  const fromLink=!!qp.get('room');
  const code=prefill||qp.get('room')||'';
  // 参加リンクから開いた人には入室だけを見せる。合言葉を設定していれば、それも条件に加える。
  const canCreate = !fromLink && (!HOST_PASS || qp.get('host')===HOST_PASS);

  $('#app').innerHTML=`
    <div class="hero">
      <div class="tally-hero" style="color:var(--indigo)">${tallySVG(5)}${tallySVG(5)}${tallySVG(3)}</div>
      <h1>${fromLink?'クイズに参加します':'その場の意見を、その場で数える。'}</h1>
      <p class="lead">${fromLink
        ?'表示名を入れて参加してください。<br>出題者が投票を開けると、設問が表示されます。'
        :'出題者が1問ずつ投票を開け、締め切ってから正解と一緒に開きます。'}</p>
    </div>
    <div class="card pad stack">
      <div><div class="eyebrow">参加する</div>
        <h2 style="font-size:18px;margin:4px 0 8px">${fromLink?'表示名を入れる':'部屋コードで入る'}</h2></div>
      <div class="row">
        <input type="text" id="rc" placeholder="コード（例 K7QM）" maxlength="6" value="${esc(code)}"
               style="flex:1;min-width:130px;text-transform:uppercase;font-family:var(--mono);letter-spacing:.2em">
        <input type="text" id="nm" placeholder="表示名" maxlength="20" style="flex:1;min-width:130px">
      </div>
      <button class="btn primary" id="jn">参加する</button>
      <p class="tiny">同じ表示名で入り直すと、それまでの回答を引き継ぎます。</p>
    </div>
    ${canCreate?`<div class="card pad stack" style="margin-top:14px">
      <div><div class="eyebrow">出題する</div>
        <h2 style="font-size:18px;margin:4px 0 8px">新しい部屋をつくる</h2>
        <p class="tiny">${DEF_Q}問・${DEF_C}択のひな形ができます。設問数も選択肢もあとから変えられます。</p></div>
      <button class="btn ghost" id="mk">部屋をつくる</button>
    </div>
    <p class="tiny center" style="margin:22px 0"><a href="#" id="rst" style="color:var(--ink-3)">接続先を変更する</a></p>`:''}`;

  const rstb=$('#rst'); if(rstb) rstb.onclick=e=>{e.preventDefault();screenSetup();};
  const mkb=$('#mk'); if(mkb) mkb.onclick=async()=>{
    mkb.disabled=true; mkb.textContent='作成中…';
    try{
      const r=await call('createRoom',{nq:DEF_Q,nc:DEF_C},true);
      if(!r.ok) throw new Error(r.error||'失敗');
      S.role='host'; S.room=r.room; S.hostKey=r.hostKey;
      S.config=r.config; S.answers={correct:r.correct};
      S.tab='edit'; saveSession(); startPoll(); renderHost();
    }catch(e){ mkb.disabled=false; mkb.textContent='部屋をつくる'; toast('部屋をつくれませんでした：'+e.message); }
  };
  $('#jn').onclick=async()=>{
    const c=($('#rc').value||'').trim().toUpperCase();
    const n=($('#nm').value||'').trim();
    if(!c){ toast('部屋コードを入れてください'); return; }
    if(!n){ toast('表示名を入れてください'); return; }
    const b=$('#jn'); b.disabled=true; b.textContent='接続中…';
    try{
      const r=await call('getConfig',{room:c});
      if(!r.ok) throw new Error('その部屋は見つかりません');
      S.role='guest'; S.room=c; S.name=n; S.pid=hash(n);
      S.config=r.config; S.answers={correct:r.correct||[]}; S.rev=r.rev;
      const mv=await call('myVote',{room:c,pid:S.pid});
      if(mv&&mv.found) S.my=mv.answers||{};
      await call('vote',{room:c,pid:S.pid,name:n},true);   // 参加者一覧に載せる
      if((S.config.revealed||[]).length) await loadResults();
      saveSession(); startPoll(); renderGuest();
    }catch(e){ b.disabled=false; b.textContent='参加する'; toast(e.message); }
  };
  $('#rc').addEventListener('keydown',e=>{if(e.key==='Enter')$('#nm').focus()});
  $('#nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('#jn').click()});
  if(code) setTimeout(()=>{const n=$('#nm'); if(n) n.focus();},50);
}

function qCard(q,i,cor,locked){
  return `<div class="card q" data-q="${i}">
    <div class="q-head">
      <div class="q-no">Q${String(i+1).padStart(2,'0')}</div>
      <div class="q-body"><input type="text" class="qtext" value="${esc(q.text)}" placeholder="設問文" ${locked?'disabled':''}></div>
      <button class="x delQ" title="この設問を削除" ${locked?'disabled':''}>×</button>
    </div>
    <div class="choices">
      ${q.choices.map((ch,j)=>`
        <div class="ch" data-c="${j}">
          <span class="ch-key">${KEYS[j]}</span>
          <input type="text" class="ctext" value="${esc(ch)}" placeholder="選択肢" ${locked?'disabled':''}>
          <label class="mark ${cor.includes(j)?'on':''}">
            <input type="checkbox" class="cor" ${cor.includes(j)?'checked':''} ${locked?'disabled':''}>正解
          </label>
          <button class="x delC" title="この選択肢を削除" ${locked?'disabled':''}>×</button>
        </div>`).join('')}
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm addC" ${locked?'disabled':''}>＋ 選択肢</button>
        <span class="tiny multi-note">${q.multi?'複数選択で回答':'ひとつだけ回答'}</span>
      </div></div></div>`;
}

function bindEditor(locked){
  if(locked) return;
  const c=S.config,a=S.answers,pane=$('#pane');
  $('#ttl').oninput=e=>{c.title=e.target.value;queueSaveConfig();};
  $('#applyC').onclick=()=>{
    const nq=Math.max(1,Math.min(50,+$('#nq').value||DEF_Q));
    const nc=Math.max(2,Math.min(10,+$('#nc').value||DEF_C));
    while(c.questions.length<nq){
      c.questions.push({text:'設問 '+(c.questions.length+1),choices:Array.from({length:nc},(_,j)=>'選択肢 '+KEYS[j]),multi:false});
      a.correct.push([]);
    }
    c.questions.length=nq; a.correct.length=nq; c.total=nq;
    c.questions.forEach((q,i)=>{
      while(q.choices.length<nc) q.choices.push('選択肢 '+KEYS[q.choices.length]);
      q.choices.length=nc;
      a.correct[i]=(a.correct[i]||[]).filter(x=>x<nc);
      q.multi=a.correct[i].length>1;
    });
    saveConfig(); paneEditor();
  };
  $('#addQ').onclick=()=>{
    c.questions.push({text:'設問 '+(c.questions.length+1),choices:Array.from({length:DEF_C},(_,j)=>'選択肢 '+KEYS[j]),multi:false});
    a.correct.push([]); c.total=c.questions.length; saveConfig(); paneEditor();
  };
  pane.addEventListener('input',e=>{
    const h=e.target.closest('[data-q]'); if(!h) return;
    const qi=+h.dataset.q;
    if(e.target.classList.contains('qtext')) c.questions[qi].text=e.target.value;
    if(e.target.classList.contains('ctext')) c.questions[qi].choices[+e.target.closest('[data-c]').dataset.c]=e.target.value;
    queueSaveConfig();
  });
  pane.addEventListener('change',e=>{
    if(!e.target.classList.contains('cor')) return;
    const qi=+e.target.closest('[data-q]').dataset.q, ci=+e.target.closest('[data-c]').dataset.c;
    const set=new Set(a.correct[qi]||[]);
    e.target.checked?set.add(ci):set.delete(ci);
    a.correct[qi]=[...set].sort((x,y)=>x-y);
    c.questions[qi].multi=a.correct[qi].length>1;
    e.target.closest('.mark').classList.toggle('on',e.target.checked);
    e.target.closest('.q').querySelector('.multi-note').textContent=c.questions[qi].multi?'複数選択で回答':'ひとつだけ回答';
    queueSaveConfig();
  });
  pane.addEventListener('click',e=>{
    const card=e.target.closest('[data-q]'); if(!card) return;
    const qi=+card.dataset.q,q=c.questions[qi];
    if(e.target.classList.contains('addC')){
      if(q.choices.length>=10){toast('選択肢は10個までです');return;}
      q.choices.push('選択肢 '+KEYS[q.choices.length]); saveConfig(); paneEditor();
    }
    if(e.target.classList.contains('delC')){
      if(q.choices.length<=2){toast('選択肢は2個以上必要です');return;}
      const ci=+e.target.closest('[data-c]').dataset.c;
      q.choices.splice(ci,1);
      a.correct[qi]=(a.correct[qi]||[]).filter(x=>x!==ci).map(x=>x>ci?x-1:x);
      q.multi=a.correct[qi].length>1;
      saveConfig(); paneEditor();
    }
    if(e.target.classList.contains('delQ')){
      if(c.questions.length<=1){toast('設問は1問以上必要です');return;}
      c.questions.splice(qi,1); a.correct.splice(qi,1); c.total=c.questions.length;
      saveConfig(); paneEditor();
    }
  });
}

function bindLink(){
  const b=$('#cp'); if(b) b.onclick=()=>copyLink(joinURL(S.room));
}
async function copyLink(url){
  try{ await navigator.clipboard.writeText(url); toast('リンクをコピーしました'); }
  catch(e){ const j=$('#jl'); if(j){ const r=document.createRange(); r.selectNode(j);
    getSelection().removeAllRanges(); getSelection().addRange(r); } toast('選択しました。コピーしてください'); }
}
async function clearVotes(){
  if(!confirm('全員の回答と進行状況を消します。設問は残ります。よろしいですか？')) return;
  try{
    await call('clearVotes',{room:S.room,hostKey:S.hostKey},true);
    S.votes=[];S.peers=0;S.answeredN=0;
    S.config.phase='edit';S.config.cur=-1;S.config.qphase='idle';S.config.revealed=[];
    setStatus('回答を消しました'); renderHost();
  }catch(e){ toast('消せませんでした'); }
}
async function wipeRoom(){
  if(!confirm('この部屋の設問と回答をすべて消します。元に戻せません。よろしいですか？')) return;
  try{ await call('deleteRoom',{room:S.room,hostKey:S.hostKey},true); }catch(e){}
  clearInterval(S.timer); clearSession(); saveSession();
  Object.assign(S,{role:null,room:'',hostKey:'',config:null,answers:null,votes:[],my:{}});
  screenStart();
}

async function setPhase(p){
  try{ const r=await call('setPhase',{room:S.room,hostKey:S.hostKey,phase:p},true);
    S.config.phase=p;
    if(r&&r.cur!==undefined) S.config.cur=r.cur;
    if(r&&r.qphase) S.config.qphase=r.qphase;
    if(p==='edit'){ S.config.revealed=[]; }
    if(p==='end') await loadResults();
  }catch(e){ toast('切り替えられませんでした'); return; }
  S.tab=(p==='edit')?'edit':'run';
  renderHost();
}
async function setQ(cur,qphase){
  try{
    const r=await call('setQ',{room:S.room,hostKey:S.hostKey,cur:cur,qphase:qphase},true);
    if(!r||!r.ok) throw new Error('失敗');
    S.config.cur=r.cur; S.config.qphase=r.qphase; S.config.revealed=r.revealed||S.config.revealed;
    S.config.phase='live';
    if(qphase==='voting'){ S.answeredN=0; }
  }catch(e){ toast('切り替えられませんでした'); renderHost(); return; }
  const msg={idle:'第'+(cur+1)+'問に移りました',voting:'第'+(cur+1)+'問の投票を開けました',
    closed:'締め切りました',results:'結果を発表しました'}[qphase];
  setStatus(msg); renderHost();
}

/* ---------- 集計 ---------- */
async function loadResults(){
  try{
    const r=await call('results',{room:S.room,hostKey:S.hostKey||''});
    if(!r||!r.ok) return false;
    S.config=r.config; S.answers={correct:r.correct||[]}; S.votes=r.votes||[];
    if(S.role==='host') S.peers=S.votes.length;
    return true;
  }catch(e){ return false; }
}

function tallyOne(qi){
  const q=S.config.questions[qi];
  if(!q) return null;
  const cor=(S.answers.correct||[])[qi]||[];
  const counts=q.choices.map(()=>0);
  let answered=0,right=0;
  S.votes.forEach(v=>{
    const pick=(v.answers||{})[qi];
    if(!pick||!pick.length) return;
    answered++;
    pick.forEach(ci=>{ if(counts[ci]!==undefined) counts[ci]++; });
    if(same(pick,cor)) right++;
  });
  return {counts,answered,right,cor,q};
}

function oneResultHTML(qi,opts){
  const t=tallyOne(qi); if(!t) return '';
  const mine=(opts&&opts.mine)||null;
  const max=Math.max(1,...t.counts);
  return `<div class="row" style="justify-content:space-between;align-items:baseline;margin-top:12px">
      <span class="eyebrow">集計</span>
      <span class="tiny">回答 ${t.answered}人 ／ 正解 ${t.right}人${t.answered?`（${Math.round(t.right/t.answered*100)}%）`:''}</span>
    </div>`+
    t.q.choices.map((ch,j)=>{
      const n=t.counts[j],isC=t.cor.includes(j),isMine=mine&&mine.includes(j);
      const pct=t.answered?Math.round(n/t.answered*100):0;
      return `<div class="res-row ${isC?'correct':''}">
        <div class="res-line"><span class="res-key">${KEYS[j]}</span>
          <span class="res-text">${esc(ch)}${isC?'<span class="tag">正解</span>':''}${isMine?'<span class="tag you">あなた</span>':''}</span>
          <span class="res-n">${n}</span><span class="res-pct">${pct}%</span></div>
        <div class="track"><div class="fill" style="width:${Math.round(n/max*100)}%"></div></div>
        <div class="tally" style="color:${isC?'var(--green)':'var(--indigo)'}">${n?tallySVG(n):''}</div>
      </div>`;
    }).join('');
}

function scoreBoard(){
  const c=S.config,cor=S.answers.correct||[];
  return S.votes.map(v=>{
    let r=0,a=0;
    c.questions.forEach((q,i)=>{
      if(!q) return;
      const p=(v.answers||{})[i];
      if(p&&p.length){a++; if(same(p,cor[i]))r++;}
    });
    return {name:v.name||'(名前なし)',r,a};
  }).sort((x,y)=>y.r-x.r);
}

/** ホストの「全体の結果」タブ */
function paneAllResults(){
  const c=S.config;
  freshPane();
  if(!S.votes.length&&!(c.revealed||[]).length){
    $('#pane').innerHTML=`<div class="card pad center stack">
      <div class="tally-hero" style="color:var(--line)">${tallySVG(5)}${tallySVG(2)}</div>
      <h2 style="font-size:17px">まだ発表した設問がありません</h2>
      <p class="tiny">進行タブで結果を発表すると、ここに積み上がります。</p>
      <button class="btn ghost sm" id="reload">最新に更新</button></div>`;
    const b=$('#reload'); if(b) b.onclick=async()=>{ await loadResults(); paneAllResults(); };
    return;
  }
  const revealed=(c.revealed||[]).slice().sort((a,b)=>a-b);
  const list=S.role==='host'?c.questions.map((q,i)=>i):revealed;
  const scores=scoreBoard();
  let totA=0,totR=0;
  list.forEach(i=>{ const t=tallyOne(i); if(t){totA+=t.answered;totR+=t.right;} });

  $('#pane').innerHTML=`
    <div class="card pad stack" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <div><div class="eyebrow">集計</div><h2 style="font-size:19px;margin-top:4px">${esc(c.title)}</h2></div>
        ${S.role==='host'?'<div class="row"><button class="btn ghost sm" id="reload">最新に更新</button><button class="btn ghost sm" id="csv">CSVで保存</button></div>':''}
      </div>
      <div class="row" style="gap:22px">
        <div><div class="eyebrow">参加者</div><div class="big">${S.votes.length}</div></div>
        <div><div class="eyebrow">発表済み</div><div class="big">${revealed.length} / ${c.questions.length}</div></div>
        <div><div class="eyebrow">全体正答率</div><div class="big">${totA?Math.round(totR/totA*100)+'%':'—'}</div></div>
      </div>
    </div>
    ${list.map(i=>{
      const q=c.questions[i]; if(!q) return '';
      return `<div class="card pad" style="margin-bottom:14px">
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <span class="eyebrow">Q${String(i+1).padStart(2,'0')}</span>
          ${revealed.includes(i)?'':'<span class="tiny">未発表</span>'}
        </div>
        <h3 style="font-size:18px;margin:6px 0 2px;line-height:1.5">${esc(q.text)}</h3>
        ${oneResultHTML(i)}</div>`;
    }).join('')}
    ${scores.length?`<div class="card pad" style="margin-bottom:24px">
      <div class="eyebrow" style="margin-bottom:8px">参加者別</div>
      <table><thead><tr><th>表示名</th><th style="text-align:right">正解</th><th style="text-align:right">回答</th></tr></thead>
      <tbody>${scores.map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${s.r}</td><td class="n">${s.a}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  const rl=$('#reload'); if(rl) rl.onclick=async()=>{ await loadResults(); paneAllResults(); setStatus('最新にしました'); };
  const cs=$('#csv'); if(cs) cs.onclick=exportCSV;
}

function exportCSV(){
  const c=S.config,cor=S.answers.correct;
  const rows=[['設問No','設問','選択肢','正解','得票','回答者数']];
  c.questions.forEach((q,i)=>{
    if(!q) return;
    const t=tallyOne(i);
    q.choices.forEach((ch,j)=>rows.push([i+1,q.text,ch,(cor[i]||[]).includes(j)?'○':'',t.counts[j],t.answered]));
  });
  rows.push([]); rows.push(['表示名','正解数','回答数']);
  scoreBoard().forEach(s=>rows.push([s.name,s.r,s.a]));
  const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  const a=document.createElement('a'); a.href=url; a.download=c.title+'_'+S.room+'.csv'; a.click();
  URL.revokeObjectURL(url); setStatus('CSVを保存しました');
}

/* ============================================================
   参加者
   ============================================================ */
function renderGuest(){
  renderBar();
  const c=S.config;
  S.sig=sigOf(c);
  const wait=(title,msg)=>`<div class="card pad center stack" style="margin-top:28px">
      <div class="tally-hero" style="color:var(--line)">${tallySVG(4)}</div>
      <h2 style="font-size:18px">${title}</h2>
      <p class="tiny"><span class="pulse"></span>${msg}</p></div>`;

  if(c.phase==='edit'){
    $('#app').innerHTML=netbarHTML()+wait('まもなく始まります','出題者が準備中です。この画面のままお待ちください。');
    $('#dock').innerHTML=''; return;
  }
  if(c.phase==='end'){ renderGuestFinal(); return; }

  const i=c.cur, q=c.questions[i];
  if(c.qphase==='idle'||!q){
    $('#app').innerHTML=netbarHTML()+wait('第 '+(i+1)+' 問','出題者の合図をお待ちください。');
    $('#dock').innerHTML=''; return;
  }

  const mine=S.my[i]||[];

  if(c.qphase==='voting'){
    $('#app').innerHTML=netbarHTML()+`<div id="gbody">
      <div class="card stage" style="margin-top:14px">
        <div class="eyebrow">第 ${i+1} 問 / 全 ${c.total} 問</div>
        <h2 class="qtext">${esc(q.text)}</h2>
        <p class="tiny">${q.multi?'あてはまるものをすべて選んでください':'ひとつ選んでください'}</p>
        ${q.choices.map((ch,j)=>`<button class="opt ${mine.includes(j)?'sel':''}" data-c="${j}">
          <span class="opt-key">${KEYS[j]}</span><span>${esc(ch)}</span></button>`).join('')}
      </div></div>`;
    $('#gbody').addEventListener('click',e=>{
      const btn=e.target.closest('.opt'); if(!btn) return;
      const ci=+btn.dataset.c;
      let sel=S.my[i]||[];
      sel=q.multi?(sel.includes(ci)?sel.filter(x=>x!==ci):[...sel,ci]):(sel.includes(ci)?[]:[ci]);
      S.my[i]=sel.sort((a,b)=>a-b);
      $('#gbody').querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',S.my[i].includes(+b.dataset.c)));
      queueSendVote(i); renderDock();
    });
    renderDock(); return;
  }

  if(c.qphase==='closed'){
    $('#app').innerHTML=netbarHTML()+`
      <div class="card stage" style="margin-top:14px">
        <div class="eyebrow">第 ${i+1} 問 / 全 ${c.total} 問</div>
        <h2 class="qtext">${esc(q.text)}</h2>
        <hr>
        <p style="font-size:15px">あなたの回答：<b>${mine.length?mine.map(x=>KEYS[x]+'. '+esc(q.choices[x])).join(' ／ '):'未回答'}</b></p>
        <p class="tiny"><span class="pulse"></span>締め切りました。結果の発表をお待ちください。</p>
      </div>`;
    $('#dock').innerHTML=''; return;
  }

  // 発表
  const cor=(S.answers.correct||[])[i]||[];
  const ok=same(mine,cor);
  $('#app').innerHTML=netbarHTML()+`
    <div style="margin-top:14px">
      ${mine.length?`<div class="verdict ${ok?'ok':'ng'}">${ok?'○　正解':'×　不正解'}</div>`:''}
      <div class="card stage">
        <div class="eyebrow">第 ${i+1} 問 / 全 ${c.total} 問</div>
        <h2 class="qtext">${esc(q.text)}</h2>
        ${oneResultHTML(i,{mine:mine})}
      </div>
      <p class="tiny center" style="margin:16px 0"><span class="pulse"></span>次の設問をお待ちください。</p>
    </div>`;
  $('#dock').innerHTML='';
}

function renderGuestFinal(){
  const c=S.config,cor=S.answers.correct||[];
  const revealed=(c.revealed||[]).slice().sort((a,b)=>a-b);
  let mine=0;
  revealed.forEach(i=>{ if(same(S.my[i],cor[i])) mine++; });
  const board=scoreBoard();
  const rank=board.findIndex(s=>s.name===S.name)+1;
  $('#app').innerHTML=netbarHTML()+`
    <div class="card pad center stack" style="margin-top:16px">
      <div class="eyebrow">おつかれさまでした</div>
      <h1 style="font-size:26px">${mine} / ${revealed.length} 問 正解</h1>
      ${rank?`<p class="tiny">${board.length}人中 ${rank} 位</p>`:''}
    </div>
    <div class="card pad" style="margin-top:14px;margin-bottom:24px">
      <div class="eyebrow" style="margin-bottom:8px">設問ごとの結果</div>
      <table><tbody>${revealed.map(i=>{
        const q=c.questions[i]; if(!q) return '';
        const okk=same(S.my[i],cor[i]);
        return `<tr><td style="width:38px" class="tiny">Q${i+1}</td>
          <td>${esc(q.text)}</td>
          <td class="n" style="color:${okk?'var(--green)':'var(--red)'}">${okk?'○':'×'}</td></tr>`;
      }).join('')}</tbody></table>
    </div>`;
  $('#dock').innerHTML='';
}

let voteTimer=null,voteQ=null;
function queueSendVote(qi){ voteQ=qi; clearTimeout(voteTimer); voteTimer=setTimeout(sendVote,500); }
async function sendVote(){
  clearTimeout(voteTimer);
  const qi=voteQ; if(qi===null||qi===undefined) return;
  try{
    const r=await call('vote',{room:S.room,pid:S.pid,name:S.name,q:qi,
      pick:JSON.stringify(S.my[qi]||[])},true);
    if(r&&r.ok===false){
      if(r.error==='closed'||r.error==='notcurrent') toast('締め切られました');
    }else{ toast('回答を受け付けました'); }
  }catch(e){ setOffline(true); toast('送信できませんでした。もう一度選び直してください'); }
  renderDock();
}

/* ============================================================
   フッター
   ============================================================ */
function renderDock(){
  const c=S.config;
  if(S.role==='guest'){
    if(!c||c.phase!=='live'||c.qphase!=='voting'){ $('#dock').innerHTML=''; return; }
    const sel=S.my[c.cur]||[];
    $('#dock').innerHTML=`<div class="dock"><div class="dock-in">
      <div class="status">${sel.length?'選択：<b>'+sel.map(x=>KEYS[x]).join('・')+'</b>（自動で送信されます）':'選択肢を押すと回答になります'}</div>
    </div></div>`;
    return;
  }
  if(S.role==='host'&&c){
    let label='準備中 — 参加者には待機画面が出ています';
    if(c.phase==='live') label={idle:'第'+(c.cur+1)+'問 待機中',voting:'第'+(c.cur+1)+'問 受付中',
      closed:'第'+(c.cur+1)+'問 締め切り',results:'第'+(c.cur+1)+'問 発表中'}[c.qphase];
    if(c.phase==='end') label='全体成績を発表しました';
    $('#dock').innerHTML=`<div class="dock"><div class="dock-in">
      <div class="status" id="stat">${label}</div></div></div>`;
  }
}

/* ============================================================
   同期
   ============================================================ */
function startPoll(){ clearInterval(S.timer); S.timer=setInterval(sync,POLL); }

async function sync(){
  if(S.busy||!S.room||document.hidden) return;
  S.busy=true;
  try{
    if(S.role==='guest'){
      const r=await call('getConfig',{room:S.room,rev:S.rev});
      if(!r||!r.ok||r.same){ setOffline(false); S.busy=false; return; }
      S.rev=r.rev; S.config=r.config;
      if(r.correct) S.answers={correct:r.correct};
      const sig=sigOf(r.config);
      if(sig!==S.sig){
        if(r.config.qphase==='results'||r.config.phase==='end') await loadResults();
        renderGuest();
      }
    }else{
      const r=await call('status',{room:S.room});
      if(r&&r.ok){
        S.peers=r.peers; S.answeredN=r.answered;
        const p=$('#peerN'); if(p) p.textContent=S.peers;
        const a=$('#ansN'); if(a) a.textContent=S.answeredN;
      }
    }
    setOffline(false);
  }catch(e){ setOffline(true); }
  finally{ S.busy=false; }
}

/* ============================================================
   起動
   ============================================================ */
async function boot(){
  const sess=loadSession();
  const qp=new URLSearchParams(location.search);
  API.url=API_URL||qp.get('api')||(sess&&sess.api)||'';
  if(!API.url){ screenSetup(); return; }
  if(qp.get('api')) saveSession();
  const urlRoom=qp.get('room');

  if(sess&&sess.role==='host'&&sess.room&&sess.hostKey&&!urlRoom){
    try{
      const r=await call('getConfig',{room:sess.room,hostKey:sess.hostKey});
      if(r&&r.ok){
        S.role='host'; S.room=sess.room; S.hostKey=sess.hostKey;
        S.config=r.config; S.answers={correct:r.correct||[]};
        S.tab=r.config.phase==='edit'?'edit':'run';
        if((r.config.revealed||[]).length) await loadResults();
        startPoll(); renderHost(); return;
      }
    }catch(e){}
  }
  if(sess&&sess.role==='guest'&&sess.room&&sess.name&&(!urlRoom||urlRoom===sess.room)){
    try{
      const r=await call('getConfig',{room:sess.room});
      if(r&&r.ok){
        S.role='guest'; S.room=sess.room; S.name=sess.name; S.pid=sess.pid||hash(sess.name);
        S.config=r.config; S.rev=r.rev; S.answers={correct:r.correct||[]};
        const mv=await call('myVote',{room:S.room,pid:S.pid});
        if(mv&&mv.found) S.my=mv.answers||{};
        if((S.config.revealed||[]).length) await loadResults();
        startPoll(); renderGuest(); return;
      }
    }catch(e){}
  }
  screenStart(urlRoom||'');
}

document.addEventListener('visibilitychange',()=>{ if(!document.hidden) sync(); });
boot();
</script>
